name: Build STENCIL PRINT PRO v69
on:
  push:
    paths:
      - '.github/workflows/build-v69.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch v68 to v69
        run: |
          echo  | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Commit v69
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'STENCIL PRINT PRO v69 - stencil clean automatique'
          git push
