name: Build STENCIL PRINT PRO v73
on:
  push:
    paths:
      - 'patch_v73.py'
      - '.github/workflows/patch-v73.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply v73 patch
        run: python patch_v73.py
      - name: Commit app and remove patch files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f patch_v73.py .github/workflows/patch-v73.yml
          git add index.html patch_v73.py .github/workflows/patch-v73.yml
          git commit -m 'STENCIL PRINT PRO v73 - simplify proven v68 UI'
          git push
