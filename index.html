<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>STENCIL PRINT PRO v91.16 - Maman Sokal</title>
</head>
<body style="margin:0;background:#0a0a0c;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;height:100vh">
<div id="status">Chargement de STENCIL PRINT PRO…</div>
<script>
(async()=>{
try{
 const r=await fetch('v79.payload.b64?v=91.16',{cache:'no-store'});
 if(!r.ok)throw new Error('Payload introuvable');
 const b64=(await r.text()).trim();
 const bin=atob(b64),bytes=new Uint8Array(bin.length);
 for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
 const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
 let html=await new Response(stream).text();
 html=html.replace('</body>','<script src="layout-fix.js?v=2"></script><script src="simple-mode.js?v=2"></script></body>');
 document.open();document.write(html);document.close();
}catch(e){document.getElementById('status').textContent='Impossible de charger STENCIL PRINT PRO : '+e.message;console.error(e)}
})();
</script>
</body>
</html>
