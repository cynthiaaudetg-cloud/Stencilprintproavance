<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>STENCIL PRINT PRO v76 - Maman Sokal</title><style>html,body{margin:0;background:#000;color:#fff}#boot{padding:30px;text-align:center;font:700 18px Arial}</style></head><body><div id="boot">CHARGEMENT STENCIL PRINT PRO v76…</div><script>
(async()=>{
const u="https://raw.githubusercontent.com/cynthiaaudetg-cloud/Stencilprintproavance/42984e60a796416986fd81af0d5c629f1deb467a/index.html";
try{
 const r=await fetch(u); if(!r.ok)throw Error("fetch");
 let h=await r.text();
 h=h.replace(/STENCIL PRINT PRO v75/g,"STENCIL PRINT PRO v76");
 const patch=`<style>
.grid-view{gap:24px}
.page-frame{position:relative;width:100%;padding:18px 18px 18px 24px}
.page-output{background:#fff;border:1px solid #444;width:100%;display:block;border-radius:3px}
.ruler-top{position:absolute;left:24px;right:18px;top:0;height:17px;color:#8b8b95;font:700 9px Oswald,sans-serif;pointer-events:none}
.ruler-left{position:absolute;left:0;top:18px;bottom:18px;width:22px;color:#8b8b95;font:700 9px Oswald,sans-serif;pointer-events:none}
.ruler-corner{position:absolute;left:0;top:0;color:var(--cyan);font:700 8px Oswald,sans-serif}
.size-readout{text-align:center;color:var(--cyan);font:700 .72rem Oswald,sans-serif;margin-top:7px}
</style>`;
 const htmlPatch=`<div class="card"><h2>TAILLE DU DESSIN</h2><div class="adjust-row"><button class="step" data-id="sizeCm" data-d="-1">−</button><input id="sizeCm" type="range" min="5" max="100" step="0.5" value="20"><button class="step" data-id="sizeCm" data-d="1">+</button></div><div class="mini" id="sizeVal">20,0 cm de large</div><div class="size-readout" id="dimensionVal">20,0 × 29,4 cm</div></div>`;
 h=h.replace(/<div class="card"><h2>ZOOM<\/h2>[\s\S]*?<\/div>/, '<input id="zoom" type="range" min="50" max="250" value="100" style="display:none">'+htmlPatch);
 const extra=`<script>
(()=>{
 const $=id=>document.getElementById(id); if(!$('gv'))return;
 const oldState=state; oldState.sizeCm=20; delete oldState.zoom;
 function syncSize(){const cm=+$('sizeCm').value;$('sizeVal').textContent=cm.toFixed(1).replace('.',',')+' cm de large';if(state.img){const ratio=(state.rot===90||state.rot===270)?state.img.naturalWidth/state.img.naturalHeight:state.img.naturalHeight/state.img.naturalWidth;$('dimensionVal').textContent=cm.toFixed(1).replace('.',',')+' × '+(cm*ratio).toFixed(1).replace('.',',')+' cm'}}
 function setSize(v){state.sizeCm=+v;syncSize();render()}
 function adjust2(id,d){const el=$(id);el.value=Math.max(+el.min,Math.min(+el.max,+el.value+d));if(id==='sizeCm'){syncSize();render()}else process()}
 window.setSize=setSize; window.adjust=adjust2;
 window.render=function(){
   const src=transformed();if(!src)return;$('gv').innerHTML='';
   const pw=state.orient==='landscape'?1152:805,ph=state.orient==='landscape'?805:1152;
   const pageWcm=state.orient==='landscape'?29.7:21,pageHcm=state.orient==='landscape'?21:29.7;
   const cfg={1:[1,1],2:[1,2],4:[2,2],6:[2,3],9:[3,3],12:[3,4]}[state.pages],rows=cfg[0],cols=cfg[1],totalW=pw*cols,totalH=ph*rows;
   let fw=totalW*(state.sizeCm/pageWcm),fh=src.height*(fw/src.width);
   if(state.pages===1){const mx=pw-38,my=ph-38,fit=Math.min(fw,mx,my*(src.width/src.height));fw=fit;fh=src.height*(fw/src.width)}
   syncSize();$('gv').style.gridTemplateColumns=`repeat(${cols},1fr)`;
   for(let i=0;i<rows*cols;i++){const col=i%cols,row=Math.floor(i/cols),frame=document.createElement('div');frame.className='page-frame';
    const top=document.createElement('div');top.className='ruler-top';
    for(let cm=0;cm<=pageWcm;cm+=5){const s=document.createElement('span');s.textContent=cm+' cm';s.style.cssText='position:absolute;left:'+(cm/pageWcm*100)+'%;transform:'+(cm?'translateX(-50%)':'');top.appendChild(s)}
    if(pageWcm%5){const s=document.createElement('span');s.textContent=pageWcm.toFixed(1).replace('.',',')+' cm';s.style.cssText='position:absolute;right:0';top.appendChild(s)}
    const left=document.createElement('div');left.className='ruler-left';
    for(let cm=0;cm<=pageHcm;cm+=5){const s=document.createElement('span');s.textContent=cm+' cm';s.style.cssText='position:absolute;top:'+(cm/pageHcm*100)+'%;transform:'+(cm?'translateY(-50%)':'');left.appendChild(s)}
    const corner=document.createElement('div');corner.className='ruler-corner';corner.textContent='A4';
    const pc=document.createElement('canvas');pc.width=pw;pc.height=ph;const c=pc.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,pw,ph);
    c.drawImage(src,(totalW-fw)/2+state.offX-col*pw,(totalH-fh)/2+state.offY-row*ph,fw,fh);
    const im=document.createElement('img');im.className='page-output';im.src=pc.toDataURL('image/jpeg',.96);frame.append(corner,top,left,im);$('gv').appendChild(frame)}
 };
 $('sizeCm').addEventListener('input',e=>setSize(e.target.value));
 syncSize();
})();
</script>`;
 h=h.replace("</head>",patch+"</head>").replace("</body>",extra+"</body>");
 document.open();document.write(h);document.close();
}catch(e){document.body.innerHTML='<div id="boot">Impossible de charger la version v76.</div>'}
})();
</script></body></html>
