<script>
(async()=>{

<script>
(function(){

 var host=size&&size.parentElement;
 if(host&&!host.dataset.sokal91){

   minus.className='sokal91-minus';plus.className='sokal91-plus';
   minus.setAttribute('aria-label','Rapetisser le dessin');plus.setAttribute('aria-label','Agrandir le dessin');

}
var st=d.createElement('style');st.textContent='\n.sokal91-sizebar{display:flex;justify-content:center;align-items:center;gap:18px;width:100%;box-sizing:border-box;padding:10px 8px 14px;position:relative;z-index:60}.sokal91-minus,.sokal91-plus{position:static;transform:none;z-index:60;width:52px;height:48px;border:0;border-radius:10px;background:#222;color:#fff;font-size:28px;font-weight:700;line-height:48px;padding:0;margin:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}.sokal91-minus:active,.sokal91-plus:active{transform:scale(.94);background:#444}.s91-title{font-weight:800;margin-bottom:8px}.s91-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.s91-row label,.s91-inches{font-size:13px}.s91-row input[readonly]{width:70px;box-sizing:border-box;padding:8px;border-radius:8px;border:1px solid #555;background:#111;color:#fff;opacity:.9;cursor:default}.s91-inches{gap:18px;margin-top:5px}.s91-info{font-size:11px;opacity:.75;margin-top:6px}.page-frame,.page-output,.grid-view{overflow:visible!important}@media(max-width:600px){.sokal91-sizebar{padding:8px 8px 14px;gap:20px}.sokal91-minus,.sokal91-plus{width:56px;height:50px;line-height:50px}.s91-row{gap:8px}.s91-row input[readonly]{width:66px}}@media print{@page{size:Letter portrait;margin:0}.grid-view{display:block!important}.page-frame{width:8.5in!important;height:11in!important;padding:0!important;margin:0!important;break-after:page;page-break-after:always}.page-output{width:8.5in!important;height:11in!important;aspect-ratio:auto!important;max-width:none!important}.page-frame:last-child{break-after:auto;page-break-after:auto}.sokal91-sizebar,#sokal91-dimensions{display:none!important}}';d.head.appendChild(st);
 install();

 html=html.replace('</body>',fix+'</body>');
 document.open();document.write(html);document.close();
}catch(e){document.getElementById('status').textContent='Impossible de charger STENCIL PRINT PRO : '+e.message;console.error(e)}
